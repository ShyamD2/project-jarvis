<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. // FLOATING AGENT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
  <!-- Three.js 3D WebGL Library & J.A.R.V.I.S. Procedural Holographic Reactor Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/static/jarvis_reactor_3d.js"></script>
  <script>
    if (typeof JarvisReactor3D === "undefined") {
      document.write('<script src="../jarvis_core/static/jarvis_reactor_3d.js"><\/script>');
    }
  </script>
  <style>
    :root {
      --bg-space: #060e1c;
      --bg-panel: #09162a;
      --bg-card: #0c1c36;
      --bg-input: #040a16;
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.6);
      --gold: #ffaa00;
      --gold-bright: #ffd700;
      --gold-glow: rgba(255, 170, 0, 0.6);
      --green: #10b981;
      --red: #ef4444;
      --border-cyan: rgba(0, 240, 255, 0.35);
      --text-main: #e2f1ff;
      --text-muted: #8ba2c4;
      --font-hud: 'Orbitron', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-ui: 'Inter', sans-serif;
    }

    /* SUIT HOLOGRAPHIC THEMES */
    body.theme-mark7 {
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.6);
      --border-cyan: rgba(0, 240, 255, 0.35);
      --gold: #ffaa00;
      --gold-glow: rgba(255, 170, 0, 0.6);
    }
    body.theme-mark50 {
      --cyan: #ffd700;
      --cyan-glow: rgba(255, 215, 0, 0.65);
      --border-cyan: rgba(255, 215, 0, 0.4);
      --gold: #ff3b30;
      --gold-glow: rgba(255, 59, 48, 0.65);
    }
    body.theme-friday {
      --cyan: #00ff9d;
      --cyan-glow: rgba(0, 255, 157, 0.65);
      --border-cyan: rgba(0, 255, 157, 0.4);
      --gold: #10b981;
      --gold-glow: rgba(16, 185, 129, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    /* SOLID FLOATING WINDOW (ZERO TRANSPARENCY) */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-space) !important;
      color: var(--text-main);
      font-family: var(--font-ui);
    }

    /* DRAGGABLE REGIONS */
    .pywebview-drag-region {
      -webkit-app-region: drag;
      cursor: grab;
    }
    .pywebview-drag-region:active {
      cursor: grabbing;
    }
    .no-drag {
      -webkit-app-region: no-drag;
      cursor: default;
    }

    /* COMPACT FLOATING CONTAINER */
    #agent-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 45%, #081a36 0%, #060e1c 70%, #030814 100%) !important;
      border: 1.5px solid var(--border-cyan);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
    }

    /* SCI-FI GRID OVERLAY */
    #agent-container::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 1;
    }

    /* =========================================================================
       1. SLEEK FLOATING HEADER
       ========================================================================= */
    .hud-header {
      height: 38px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      background: rgba(6, 14, 28, 0.85);
      z-index: 20;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
      animation: pulse-dot 1.8s infinite ease-in-out;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .brand-name {
      font-family: var(--font-hud);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 10px var(--cyan-glow);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hdr-btn {
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #aaeaff;
      width: 24px;
      height: 24px;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-family: var(--font-mono);
      transition: all 0.2s;
    }

    .hdr-btn:hover {
      background: var(--cyan);
      color: #02060f;
      box-shadow: 0 0 10px var(--cyan);
    }

    .hdr-btn-screen {
      width: auto;
      padding: 0 8px;
      font-size: 10px;
      font-weight: 700;
      border-color: var(--gold);
      color: var(--gold);
    }

    .hdr-btn-screen:hover {
      background: var(--gold);
      color: #02060f;
      box-shadow: 0 0 10px var(--gold);
    }

    .hdr-btn-close:hover {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      box-shadow: 0 0 10px var(--red);
    }

    /* =========================================================================
       2. STATUS PILL & 3D ARC REACTOR (MATCHING INDEX.HTML)
       ========================================================================= */
    .reactor-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
      padding: 8px 12px 0;
    }

    /* EXACT PILL FROM USER SCREENSHOT */
    .pill-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      margin-bottom: 2px;
      z-index: 15;
    }

    .state-pill {
      font-family: var(--font-hud);
      font-size: 11px;
      letter-spacing: 2px;
      padding: 5px 22px;
      border-radius: 20px;
      background: #040f20;
      border: 1.5px solid var(--cyan);
      color: var(--cyan);
      font-weight: 800;
      text-transform: uppercase;
      box-shadow: 0 0 16px var(--cyan-glow);
      transition: all 0.3s ease;
    }

    .frequency-subtext {
      font-family: var(--font-mono);
      font-size: 8.5px;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      text-align: center;
    }

    /* 3D HOLOGRAM CONTAINER (FROM INDEX.HTML) */
    .hologram-stage-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }
    .hologram-stage-container:active {
      cursor: grabbing;
    }

    /* VOLUMETRIC AURA GLOW (FROM INDEX.HTML) */
    .hologram-volumetric-glow {
      position: absolute;
      width: 290px;
      height: 290px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 170, 0, 0.28) 0%, rgba(255, 100, 0, 0.12) 40%, rgba(0, 240, 255, 0.03) 65%, transparent 80%);
      pointer-events: none;
      z-index: 5;
      mix-blend-mode: screen;
      filter: blur(20px);
    }

    #jarvis-core-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      filter: drop-shadow(0 0 18px rgba(255, 170, 0, 0.75)) drop-shadow(0 0 35px rgba(0, 240, 255, 0.4));
    }

    /* WAVEFORM BARS (FROM INDEX.HTML) */
    .core-waveform-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 16px;
      margin-top: 2px;
      z-index: 15;
    }

    .wave-bar {
      width: 2px;
      height: 4px;
      background: var(--gold);
      box-shadow: 0 0 6px var(--gold);
      border-radius: 1px;
      transition: height 0.08s ease;
    }

    /* =========================================================================
       3. FLOATING TRANSCRIPT & COMMAND BAR
       ========================================================================= */
    .hud-footer {
      padding: 10px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #071222;
      border-top: 1px solid rgba(0, 240, 255, 0.2);
      z-index: 20;
    }

    .transcript-bubble {
      font-size: 12px;
      line-height: 1.4;
      color: #e2f1ff;
      background: #091932;
      padding: 8px 12px;
      border-radius: 6px;
      border-left: 2px solid var(--cyan);
      border: 1px solid rgba(0, 240, 255, 0.2);
      max-height: 52px;
      overflow-y: auto;
      text-shadow: 0 0 6px rgba(0, 240, 255, 0.2);
    }

    .input-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mic-btn {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--green);
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .mic-btn.active {
      animation: pulse-mic 2s infinite ease-in-out;
    }

    .mic-btn.speaking {
      background: rgba(239, 68, 68, 0.3);
      border-color: var(--red);
      color: #fff;
      box-shadow: 0 0 16px var(--red);
    }

    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); box-shadow: 0 0 8px rgba(16, 185, 129, 0.25); }
      50% { transform: scale(1.05); box-shadow: 0 0 16px rgba(16, 185, 129, 0.55); }
    }

    .text-input {
      flex: 1;
      height: 34px;
      background: var(--bg-input);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 6px;
      padding: 0 10px;
      color: #fff;
      font-family: var(--font-ui);
      font-size: 12px;
      outline: none;
      transition: all 0.2s;
    }

    .text-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .text-input::placeholder {
      color: #5d7599;
      font-size: 11px;
    }

    .send-btn {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: var(--cyan);
      border: none;
      color: #02060f;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 800;
      font-size: 13px;
      transition: all 0.2s;
    }

    .send-btn:hover {
      box-shadow: 0 0 14px var(--cyan);
      transform: scale(1.05);
    }

    /* MINI ORB COLLAPSIBLE MODE */
    #agent-container.mini-mode {
      width: 96px !important;
      height: 96px !important;
      border-radius: 50% !important;
      border: 2px solid var(--cyan) !important;
      box-shadow: 0 0 25px var(--cyan-glow), inset 0 0 15px rgba(0, 0, 0, 0.9) !important;
      cursor: pointer !important;
      background: radial-gradient(circle at 50% 50%, #081a36 0%, #030814 100%) !important;
    }
    #agent-container.mini-mode .hud-header,
    #agent-container.mini-mode .hud-footer,
    #agent-container.mini-mode .pill-wrapper,
    #agent-container.mini-mode .core-waveform-strip {
      display: none !important;
    }
    #agent-container.mini-mode .reactor-stage {
      padding: 0 !important;
      margin: 0 !important;
      width: 96px !important;
      height: 96px !important;
    }
    #agent-container.mini-mode .hologram-stage-container {
      width: 90px !important;
      height: 90px !important;
    }
    #agent-container.mini-mode .hologram-volumetric-glow {
      width: 84px !important;
      height: 84px !important;
    }
    #agent-container.mini-mode #jarvis-core-canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* DRAG AND DROP INGESTION OVERLAY */
    .drop-target-overlay {
      position: absolute;
      top: 6px; left: 6px; right: 6px; bottom: 6px;
      border: 2px dashed var(--cyan);
      border-radius: 10px;
      background: rgba(4, 10, 22, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 100;
      pointer-events: none;
      box-shadow: 0 0 25px var(--cyan-glow);
    }
    .drop-target-overlay.active {
      display: flex;
    }
    .drop-icon {
      font-size: 28px;
      animation: bounce-icon 1s infinite alternate;
    }
    @keyframes bounce-icon {
      0% { transform: translateY(-3px); }
      100% { transform: translateY(3px); }
    }
    .drop-text {
      font-family: var(--font-hud);
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--cyan);
      text-transform: uppercase;
      font-weight: 800;
    }
    .drop-hint {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div id="agent-container">

  <!-- HOLOGRAPHIC DRAG & DROP OVERLAY -->
  <div class="drop-target-overlay" id="drop-overlay">
    <div class="drop-icon">📥</div>
    <div class="drop-text">STARK INGESTION</div>
    <div class="drop-hint">Drop file, code, or image to inspect</div>
  </div>

  <!-- 1. DRAGGABLE FLOATING HEADER -->
  <header class="hud-header pywebview-drag-region">
    <div class="brand-group">
      <div class="brand-dot"></div>
      <div class="brand-name" id="brand-title">J.A.R.V.I.S.</div>
    </div>
    <div class="header-actions no-drag">
      <button class="hdr-btn hdr-btn-stop" onclick="triggerEmergencyStop()" title="Emergency Stand-Down (Halt All Operations & Terminals)" style="border-color: #ef4444; color: #ef4444; font-weight: 700;">🚨</button>
      <button class="hdr-btn" onclick="cycleTheme()" id="theme-btn" title="Suit Hologram Theme (Mark VII / Mark 50 / F.R.I.D.A.Y.)">🎨</button>
      <button class="hdr-btn hdr-btn-screen" onclick="triggerScreenRecognition()" title="Analyze Display Screen">👁️ SCREEN</button>
      <button class="hdr-btn" id="audio-btn" onclick="toggleAudioSpeech()" title="Toggle Neural Speech Audio">🔊</button>
      <button class="hdr-btn" onclick="toggleMiniMode(true)" title="Collapse to Mini Reactor Orb">⚡</button>
      <button class="hdr-btn" onclick="minimizeWindow()" title="Minimize">_</button>
      <button class="hdr-btn hdr-btn-close" onclick="closeWindow()" title="Close">✕</button>
    </div>
  </header>

  <!-- 2. CENTRAL REACTOR STAGE (IDENTICAL TO USER SCREENSHOT & INDEX.HTML) -->
  <main class="reactor-stage pywebview-drag-region">
    <!-- PILL & SUBTEXT -->
    <div class="pill-wrapper no-drag">
      <div class="state-pill" id="agent-state-label">STANDBY // IDLE</div>
      <div class="frequency-subtext" id="state-subtext">CORE STABILIZER: ONLINE &bull; SCREEN &amp; KEYBOARD: READY</div>
    </div>

    <!-- 3D HOLOGRAPHIC AI CORE FROM INDEX.HTML -->
    <div class="hologram-stage-container" id="hologram-stage" onclick="handleOrbClick()" title="Click or speak anytime hands-free">
      <div class="hologram-volumetric-glow"></div>
      <canvas id="jarvis-core-canvas"></canvas>
    </div>

    <!-- REAL-TIME AUDIO WAVEFORM STRIP -->
    <div class="core-waveform-strip no-drag" id="core-waveform"></div>
  </main>

  <!-- 3. FLOATING TRANSCRIPT & COMMAND INPUT -->
  <footer class="hud-footer no-drag">
    <div class="transcript-bubble" id="speech-bubble" onclick="window.stopSpeakingAudio()" title="Click to stop speaking">
      Good day, sir. J.A.R.V.I.S. is listening hands-free. Click 👁️ SCREEN or speak anytime.
    </div>

    <div class="input-bar">
      <button class="mic-btn active" id="mic-btn" onclick="toggleMic()" title="Always-On Voice Toggle">🎙️</button>
      <input type="text" class="text-input" id="command-input" placeholder="Speak hands-free or type instruction..." onkeydown="handleKey(event)" />
      <button class="send-btn" onclick="submitCommand()" title="Send">➤</button>
    </div>
  </footer>

</div>

<script>
  let reactor = null;
  let recognition = null;
  let alwaysVoiceActive = true;
  let voiceSilenceTimer = null;
  const waveBars = [];

  // 9 AGENT STATES
  const AGENT_STATES = {
    IDLE: { label: "STANDBY // IDLE", subtext: "CORE STABILIZER: ONLINE • SCREEN & KEYBOARD: READY", color: "#00f0ff" },
    LISTENING: { label: "AUDIO INGEST // LISTENING", subtext: "CAPTURING USER VOICE...", color: "#00f0ff" },
    UNDERSTANDING: { label: "COGNITIVE PARSING", subtext: "ANALYZING INTENT & PARAMETERS", color: "#38bdf8" },
    PLANNING: { label: "TACTICAL PLANNING", subtext: "FORMULATING EXECUTION PLAN", color: "#f59e0b" },
    ROUTING: { label: "MESH ROUTING", subtext: "TARGETING ACTIVE NODE", color: "#a855f7" },
    EXECUTING: { label: "AGENTOS EXECUTING", subtext: "CONTROLLING WORKSTATION // REAL EXECUTION", color: "#ffaa00" },
    VERIFYING: { label: "VALIDATING TELEMETRY", subtext: "SENSORY REALITY VERIFICATION", color: "#10b981" },
    RESPONDING: { label: "TRANSMITTING RESPONSE", subtext: "DELIVERING RESULTS, SIR", color: "#00f0ff" },
    EMERGENCY: { label: "EMERGENCY HALT // STAND-DOWN", subtext: "ALL AUTONOMOUS WORKERS & PROCESSES TERMINATED", color: "#ef4444" }
  };

  // SUIT THEMES ENGINE
  const SUIT_THEMES = [
    { id: "theme-mark7", name: "MARK VII (CYAN)", title: "J.A.R.V.I.S." },
    { id: "theme-mark50", name: "MARK 50 (GOLD)", title: "STARK // M50" },
    { id: "theme-friday", name: "F.R.I.D.A.Y. (EMERALD)", title: "F.R.I.D.A.Y." }
  ];
  let activeThemeIdx = 0;

  function initSuitTheme() {
    const saved = localStorage.getItem("jarvis_suit_theme");
    if (saved) {
      const idx = SUIT_THEMES.findIndex(t => t.id === saved);
      if (idx !== -1) activeThemeIdx = idx;
    }
    applyTheme(activeThemeIdx, false);
  }

  function applyTheme(idx, announce = true) {
    activeThemeIdx = idx % SUIT_THEMES.length;
    const th = SUIT_THEMES[activeThemeIdx];
    document.body.className = th.id;
    const titleEl = document.getElementById("brand-title");
    if (titleEl) titleEl.innerText = th.title;
    localStorage.setItem("jarvis_suit_theme", th.id);

    if (announce) {
      setSpeechText(`Switched holographic suit HUD to ${th.name}, sir.`);
      speakResponse(`Suit HUD switched to ${th.name}.`);
    }
  }

  function cycleTheme() {
    applyTheme(activeThemeIdx + 1, true);
  }

  // COLLAPSIBLE MINI ORB MODE
  let isMiniMode = false;

  function toggleMiniMode(enable) {
    isMiniMode = (typeof enable === "boolean") ? enable : !isMiniMode;
    const container = document.getElementById("agent-container");

    if (isMiniMode) {
      container.classList.add("mini-mode");
      if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.toggle_mini_mode === "function") {
        window.pywebview.api.toggle_mini_mode(true);
      }
    } else {
      container.classList.remove("mini-mode");
      if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.toggle_mini_mode === "function") {
        window.pywebview.api.toggle_mini_mode(false);
      }
    }
  }

  function handleOrbClick() {
    let isSpeakingAudio = (currentAudio && !currentAudio.paused && !currentAudio.ended);
    if (isSpeakingAudio) {
      window.stopSpeakingAudio();
      return;
    }
    if (isMiniMode) {
      toggleMiniMode(false);
    }
  }

  // TWO-WAY SPOKEN NEURAL SPEECH & AUDIO ANALYSER
  let speechAudioEnabled = true;
  let speechAudioEl = null;
  let currentAudio = null;
  let audioContext = null;
  let audioAnalyser = null;
  let audioSourceNode = null;
  let audioFreqBuffer = null;

  function toggleAudioSpeech() {
    speechAudioEnabled = !speechAudioEnabled;
    const btn = document.getElementById("audio-btn");
    if (btn) {
      btn.innerText = speechAudioEnabled ? "🔊" : "🔇";
      btn.style.opacity = speechAudioEnabled ? "1" : "0.5";
    }
    setSpeechText(speechAudioEnabled ? "Voice synthesis unmuted, sir." : "Voice synthesis muted.");
  }

  async function speakResponse(text) {
    if (!speechAudioEnabled || !text) return;
    try {
      if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.synthesize_speech === "function") {
        const res = await window.pywebview.api.synthesize_speech(text);
        if (res && res.success && res.audio_b64) {
          playAudioDataUri(res.audio_b64);
          return;
        }
      }
    } catch (e) {
      console.warn("Speech synthesis notice:", e);
    }
  }

  function playAudioDataUri(dataUri) {
    try {
      if (!speechAudioEl) {
        speechAudioEl = new Audio();
        speechAudioEl.crossOrigin = "anonymous";
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioContext = new AudioCtx();
        if (audioContext) {
          try {
            audioAnalyser = audioContext.createAnalyser();
            audioAnalyser.fftSize = 64;
            audioFreqBuffer = new Uint8Array(audioAnalyser.frequencyBinCount);
            audioSourceNode = audioContext.createMediaElementSource(speechAudioEl);
            audioSourceNode.connect(audioAnalyser);
            audioAnalyser.connect(audioContext.destination);
          } catch (e) {
            console.debug("Audio node setup notice:", e);
          }

    window.addEventListener("dragenter", (e) => {
      e.preventDefault();
      dragCounter++;
      overlay.classList.add("active");

    window.addEventListener("dragleave", (e) => {
      e.preventDefault();

        overlay.classList.remove("active");

    window.addEventListener("dragover", (e) => {

    window.addEventListener("drop", (e) => {
      e.preventDefault();
      dragCounter = 0;
      overlay.classList.remove("active");

      if (files && files.length > 0) {

    });

  async function initWebAudioSensory() {
    try {
      if (window.pywebview) {
        console.log("🎙️ [Sensory] PyWebView native hardware microphone active. Browser getUserMedia bypassed.");
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

        return;
      }
      if (liveMicStream) return;

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!liveAudioCtx && AudioCtx) {
        liveAudioCtx = new AudioCtx();
      }
      if (liveAudioCtx && liveAudioCtx.state === "suspended") {
        try { await liveAudioCtx.resume(); } catch(e) {}
      }

      liveMicStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      });

      const micSource = liveAudioCtx.createMediaStreamSource(liveMicStream);
      liveMicAnalyser = liveAudioCtx.createAnalyser();
      liveMicAnalyser.fftSize = 64;

      const bufferSize = 4096;
      liveScriptProcessor = liveAudioCtx.createScriptProcessor(bufferSize, 1, 1);

      const dummyMute = liveAudioCtx.createGain();
      dummyMute.gain.value = 0.0;
      dummyMute.connect(liveAudioCtx.destination);

      micSource.connect(liveMicAnalyser);
      micSource.connect(liveScriptProcessor);
      liveScriptProcessor.connect(dummyMute);

      const micBtn = document.getElementById("mic-btn");
      if (micBtn) {
        micBtn.classList.add("active");
        micBtn.style.opacity = "1";
      }
      console.log("🎙️ [WebAudio] Continuous sensory microphone stream connected.");

      liveScriptProcessor.onaudioprocess = (e) => {
        if (!alwaysVoiceActive) return;
        const inputData = e.inputBuffer.getChannelData(0);
        let sum = 0;
        for (let i = 0; i < inputData.length; i++) {
          sum += inputData[i] * inputData[i];
        }
        const rms = Math.sqrt(sum / inputData.length);
        liveAudioEnergy = Math.min(1.0, rms * 8.0);

        // Don't capture user voice while Jarvis's own TTS audio is playing
        let isSpeakingAudio = (currentAudio && !currentAudio.paused && !currentAudio.ended);
        if (isSpeakingAudio) return;

        const SPEECH_THRESHOLD = 0.020;
        const sampleRate = liveAudioCtx ? (liveAudioCtx.sampleRate || 44100) : 44100;

        if (rms > SPEECH_THRESHOLD) {
          speechFrames++;
          silenceFrames = 0;
          if (!isLiveCapturing) {
            isLiveCapturing = true;
            liveSpeechChunks = [];
            setAgentState("LISTENING");
            if (micBtn) micBtn.classList.add("speaking");
          }
          liveSpeechChunks.push(new Float32Array(inputData));
        } else if (isLiveCapturing) {
          silenceFrames++;
          liveSpeechChunks.push(new Float32Array(inputData));
          const framesForEnd = Math.max(6, Math.round((sampleRate / bufferSize) * 0.70));
          const totalSamples = liveSpeechChunks.reduce((acc, c) => acc + c.length, 0);

          if (silenceFrames >= framesForEnd) {
            if (totalSamples > sampleRate * 0.40) {
              const chunksToProcess = [...liveSpeechChunks];
              liveSpeechChunks = [];
              isLiveCapturing = false;
              silenceFrames = 0;
              speechFrames = 0;
              if (micBtn) micBtn.classList.remove("speaking");
              processCapturedVoice(chunksToProcess, sampleRate);
            } else {
              liveSpeechChunks = [];
              isLiveCapturing = false;
              silenceFrames = 0;
              speechFrames = 0;
              if (micBtn) micBtn.classList.remove("speaking");
              setAgentState("IDLE");
            }
          }
        }
      };
    } catch (err) {
      console.log("[WebAudio] Note on getUserMedia:", err.message);
    }
  }

  function encodeWavBlob(chunks, inputSampleRate) {
    const targetSampleRate = 16000;
    const totalLength = chunks.reduce((acc, c) => acc + c.length, 0);
    const fullBuffer = new Float32Array(totalLength);
    let offset = 0;
    for (const chunk of chunks) {
      fullBuffer.set(chunk, offset);
      offset += chunk.length;
    }

    let peak = 0;
    for (let i = 0; i < totalLength; i++) {
      const v = Math.abs(fullBuffer[i]);
      if (v > peak) peak = v;
    }
    const gain = peak > 0.005 ? Math.min(10.0, 0.92 / peak) : 1.0;

    const ratio = inputSampleRate / targetSampleRate;
    const outputLength = Math.round(totalLength / ratio);
    const downsampled = new Float32Array(outputLength);
    for (let i = 0; i < outputLength; i++) {
      const srcPos = i * ratio;
      const i0 = Math.floor(srcPos);
      const i1 = Math.min(i0 + 1, totalLength - 1);
      const frac = srcPos - i0;
      const interp = fullBuffer[i0] * (1 - frac) + fullBuffer[i1] * frac;
      downsampled[i] = Math.max(-1.0, Math.min(1.0, interp * gain));
    }

    const wavBuffer = new ArrayBuffer(44 + outputLength * 2);
    const view = new DataView(wavBuffer);
    function writeStr(pos, s) {
      for (let i = 0; i < s.length; i++) view.setUint8(pos + i, s.charCodeAt(i));
    }
    writeStr(0, "RIFF");
    view.setUint32(4, 36 + outputLength * 2, true);
    writeStr(8, "WAVE");
    writeStr(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, targetSampleRate, true);
    view.setUint32(28, targetSampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeStr(36, "data");
    view.setUint32(40, outputLength * 2, true);

    let p = 44;
    for (let i = 0; i < outputLength; i++, p += 2) {
      const s = Math.max(-1, Math.min(1, downsampled[i]));
      view.setInt16(p, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return new Blob([view], { type: "audio/wav" });
  }

  async function processCapturedVoice(chunks, sampleRate) {
    setAgentState("UNDERSTANDING");
    setSpeechText("Transcribing speech via Groq Whisper...");
    try {
      const wavBlob = encodeWavBlob(chunks, sampleRate);
      const reader = new FileReader();
      reader.onloadend = async () => {
        const b64 = reader.result;
        // 1. Send to native Python bridge if pywebview is available
        if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.transcribe_audio_blob === "function") {
          const res = await window.pywebview.api.transcribe_audio_blob(b64);
          if (res && res.text) {
            window.onVoiceTranscriptReceived(res.text, true);
            return;
          }
        }
        // 2. Direct HTTP endpoint fallback
        try {
          const resp = await fetch("/api/v1/sensory/transcribe", { method: "POST", body: wavBlob });
          const data = await resp.json();
          if (data && data.transcript) {
            window.onVoiceTranscriptReceived(data.transcript, true);
          } else {
            setAgentState("IDLE");
          }
        } catch (fetchErr) {
          setAgentState("IDLE");
        }
      };
      reader.readAsDataURL(wavBlob);
    } catch (e) {
      console.error("Voice processing error:", e);
      setAgentState("IDLE");
    }
  }

    for (let i = 0; i < 24; i++) {

  let pythonAudioEnergy = 0;

  function animateWaveform() {
    const now = Date.now();
    let isSpeakingAudio = (currentAudio && !currentAudio.paused && !currentAudio.ended);

    if (isSpeakingAudio && audioAnalyser && audioFreqBuffer) {
      audioAnalyser.getByteFrequencyData(audioFreqBuffer);
      for (let b = 0; b < waveBars.length; b++) {
        const freqIdx = b % audioFreqBuffer.length;
        const rawVal = audioFreqBuffer[freqIdx] / 255;
        const barHeight = Math.max(3, Math.min(22, rawVal * 26));
        waveBars[b].style.height = `${barHeight}px`;
      }
      if (reactor && typeof reactor.updateAudio === "function") {
        let avg = 0;
        for (let i = 0; i < audioFreqBuffer.length; i++) avg += audioFreqBuffer[i];
        avg = (avg / audioFreqBuffer.length) / 255;
        reactor.updateAudio(avg);
      }
    } else if (pythonAudioEnergy > 0.04) {
      for (let b = 0; b < waveBars.length; b++) {
        const flutter = Math.sin(now * 0.02 + b * 0.5) * 0.18;
        const val = Math.max(0.12, Math.min(1.0, pythonAudioEnergy * 0.85 + flutter));
        const barHeight = Math.max(3, Math.min(22, val * 24));
        waveBars[b].style.height = `${barHeight}px`;
      }
      if (reactor && typeof reactor.updateAudio === "function") {
        reactor.updateAudio(pythonAudioEnergy);
      }
      pythonAudioEnergy *= 0.94;
    } else {
      for (let b = 0; b < waveBars.length; b++) {
        let val = 0.15 + Math.sin(now * 0.003 + b * 0.5) * 0.12;
        if (document.getElementById("mic-btn") && document.getElementById("mic-btn").classList.contains("speaking")) {
          val = Math.max(0.3, Math.min(1.0, 0.4 + Math.sin(now * 0.01 + b * 0.4) * 0.5));
        }
        const barHeight = Math.max(3, Math.min(18, val * 20));
        waveBars[b].style.height = `${barHeight}px`;
      }
    }
    requestAnimationFrame(animateWaveform);
  }

  // DISPATCH COMMAND VIA PYWEBVIEW NATIVE BRIDGE OR FASTAPI
  async function submitCommand(overrideText) {
    const input = document.getElementById("command-input");
    const text = (typeof overrideText === "string" && overrideText ? overrideText : (input ? input.value : "")).trim();
    if (!text) return;
    if (input) input.value = "";

    // Voice / text shortcut commands
    const lower = text.toLowerCase();
    if (lower.includes("mini mode") || lower.includes("orb mode") || lower.includes("collapse")) {
      toggleMiniMode(true);
      setSpeechText("Collapsed to 3D Arc Reactor Orb mode, sir.");
      speakResponse("Collapsed to mini reactor orb mode.");
      return;
    }
    if (lower.includes("full mode") || lower.includes("expand hud") || lower.includes("expand window")) {
      toggleMiniMode(false);
      setSpeechText("Expanded HUD command center, sir.");
      speakResponse("Expanded command center.");
      return;
    }
    if (lower.includes("change theme") || lower.includes("switch theme")) {
      cycleTheme();
      return;
    }
    if (lower.includes("what is on my screen") || lower.includes("look at screen") || lower.includes("analyze screen")) {
      triggerScreenRecognition();
      return;
    }

    setAgentState("UNDERSTANDING");
    setSpeechText(`Ingesting instruction: "${text}"`);

    try {
      setTimeout(() => setAgentState("PLANNING"), 200);
      setTimeout(() => setAgentState("ROUTING"), 400);

      let data = null;

      // Check pywebview Native Bridge First (calls J.A.R.V.I.S. Conversational Brain)
      if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.execute_command === "function") {
        data = await window.pywebview.api.execute_command(text);
      } else {
        const resp = await fetch("/api/device/execute", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: text, source_device: "desktop-shyam" })
        });
        data = await resp.json();
      }

      setAgentState("EXECUTING");

      const reply = data.response || data.message || "Instruction completed successfully, sir.";
      
      // If there are actions executed, show summary in speech bubble
      let actionNotice = "";
      if (data.actions_executed && Array.isArray(data.actions_executed) && data.actions_executed.length > 0) {
        const act = data.actions_executed[0];
        if (act.tool === "browse_web" && act.arguments && act.arguments.url) {
          actionNotice = `\n🌐 ${act.arguments.url}`;
        } else if (act.tool === "launch_app" && act.arguments && act.arguments.app) {
          actionNotice = `\n⚡ Launched ${act.arguments.app}`;
        }
      }

      setTimeout(() => {
        setAgentState("RESPONDING");
        setSpeechText(reply + actionNotice);

        // Update epistemic status if returned from AgentOS backend
        if (data.epistemic_state) {
          const subEl = document.getElementById("state-subtext");
          if (subEl) {
            subEl.innerText = `EPISTEMIC: [${data.epistemic_state}] • ${data.epistemic_summary || "Sensory verified"}`;
          }
        }

        // Play audio synthesized by J.A.R.V.I.S. Brain if available
        if (data.audio_b64) {
          playAudioDataUri(data.audio_b64);
        } else {
          speakResponse(reply);
          setTimeout(() => setAgentState("IDLE"), 4000);
        }
      }, 500);

    } catch (e) {
      console.error("Execution error:", e);
      setAgentState("IDLE");
      setSpeechText(`Processed: ${text}`);
    }
  }

            micBtn.classList.remove("speaking");
          }
          console.log("🎙️ [WebSpeech] Fallback speech recognition active.");
        };

        recognition.onresult = (event) => {
          let interimTranscript = "";
          let finalTranscript = "";

          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              finalTranscript += event.results[i][0].transcript;
            } else {
              interimTranscript += event.results[i][0].transcript;
            }
          }

          const currentText = (finalTranscript || interimTranscript).trim();
          if (currentText) {
            window.onVoiceTranscriptReceived(currentText, Boolean(finalTranscript));
          }
        };

        recognition.onerror = (event) => {
          console.warn("Speech recognition notice:", event.error);
          if (event.error !== "no-speech" && event.error !== "audio-capture") {
            if (alwaysVoiceActive) {
              setTimeout(() => {
                try { recognition.start(); } catch(e) {}
              }, 500);
            }
          }
        };

        recognition.onend = () => {
          if (alwaysVoiceActive) {
            setTimeout(() => {
              try { recognition.start(); } catch(e) {}
            }, 300);
          }
        };

        try {
          recognition.start();
        } catch(e) {}

      } catch (err) {
        console.warn("Speech recognition init notice:", err);
      }
    }
  }

  async function toggleMic() {
    const micBtn = document.getElementById("mic-btn");

    // 1. Try Native Python Hardware Bridge First
    if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.toggle_voice_capture === "function") {
      try {
        const res = await window.pywebview.api.toggle_voice_capture();
        if (res && typeof res.listening === "boolean") {
          window.onVoiceStatusChanged(res.listening);
          return;
        }
      } catch (e) {
        console.warn("Native mic toggle notice:", e);
      }
    }

    // 2. Fallback to Web Speech API
    alwaysVoiceActive = !alwaysVoiceActive;
    if (!alwaysVoiceActive) {
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
      if (micBtn) {
        micBtn.classList.remove("active");
        micBtn.classList.remove("speaking");
        micBtn.style.opacity = "0.5";
      }
      setSpeechText("Hands-free microphone paused.");
    } else {
      if (micBtn) {
        micBtn.classList.add("active");
        micBtn.style.opacity = "1";
      }
      setSpeechText("Hands-free microphone resumed and listening, sir.");
      if (liveAudioCtx && liveAudioCtx.state === "suspended") {
        try { liveAudioCtx.resume(); } catch(e) {}
      }
      if (!liveMicStream) {
        initWebAudioSensory();
      }
      if (recognition) {
        try { recognition.start(); } catch(e) {}
      }
    }
  }

  // WINDOW CONTROLS
  function minimizeWindow() {
    if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.minimize === "function") {
      window.pywebview.api.minimize();
    }
  }

  function closeWindow() {
    if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.close === "function") {
      window.pywebview.api.close();
    } else {
      window.close();
    }
  }
</script>
