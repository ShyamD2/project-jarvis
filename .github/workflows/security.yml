name: Security & Vulnerability Guard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan

jobs:
  security:
    name: Security Invariant Regression & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pytest pytest-asyncio pyyaml psutil

      - name: Run Permanent Security Regression Suite
        run: |
          pytest tests/security/ -v --tb=short

      - name: Static Security Scan (Bandit)
        run: |
          bandit -r services/ shared/ -ll -ii -x "tests/,scratch/" || true
