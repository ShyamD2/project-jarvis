name: J.A.R.V.I.S. Test & Reliability Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Unit, Security, & Verification Suite
    runs-on: windows-latest
    env:
      PYTHONPATH: .
      JARVIS_ENV: test
      JARVIS_MASTER_SECRET: test_security_secret_key_32_bytes_len_1234

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Security Regression Suite (10 Audit Invariants)
        run: |
          python -m pytest tests/security/ -v --tb=short

      - name: Run Ground-Truth Verification Invariant Suite
        run: |
          python -m pytest tests/verification/ -v --tb=short

      - name: Run Real-Machine E2E Tests
        run: |
          python -m pytest tests/e2e/ -v --tb=short

      - name: Execute Empirical Reliability Benchmark Runner
        run: |
          python benchmarks/run_benchmark.py --profile local

      - name: Upload Benchmark Results & Report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: |
            benchmarks/results/latest.json
            benchmarks/report.md
