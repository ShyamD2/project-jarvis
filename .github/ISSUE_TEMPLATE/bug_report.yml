name: 🐛 Bug Report
description: Report a reproducible problem or invariant violation in Project J.A.R.V.I.S.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please verify you are running on a supported Python version (3.10-3.13) on Windows 10/11.
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "When executing command X, component Y threw error Z..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Run `python jarvis.py start`
        2. Execute instruction `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: subsystem
    attributes:
      label: Affected Subsystem
      options:
        - "Core API / WebSockets"
        - "Brain & Intent Router"
        - "Permission Engine & Blast Radius"
        - "Ground-Truth Verification Engine"
        - "Native Win32 Audio & OS Automation"
        - "Sensory / Wake Word / TTS"
        - "Physical IoT & ESP32"
        - "Cloud / DevOps / AWS"
        - "Holographic HUD Dashboard"
        - "Mobile Remote / Telegram"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Traceback
      render: shell
      placeholder: "Paste traceback from jarvis.log or terminal..."
